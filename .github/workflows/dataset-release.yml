name: Publish validated dataset

on:
  workflow_dispatch:
    inputs:
      candidate_batch:
        description: Batch directory name under workspace/交换候选
        required: true
        type: string
      engineering_batch:
        description: Batch directory name under workspace/工程记录
        required: true
        type: string
      release_mode:
        description: Overwrite dataset-latest or also publish an immutable milestone
        required: true
        default: latest
        type: choice
        options:
          - latest
          - milestone
      milestone_name:
        description: Required only for milestone; letters, digits, dot, underscore and hyphen
        required: false
        default: ""
        type: string
      milestone_confirm:
        description: For milestone, type CREATE_IMMUTABLE_RELEASE exactly
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: legal-corpus-dataset-release
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
    runs-on: [self-hosted, windows, x64, legal-corpus]
    timeout-minutes: 360
    defaults:
      run:
        shell: pwsh
    env:
      LEGAL_SOURCE_ROOT: ${{ vars.LEGAL_SOURCE_ROOT }}
      LEGAL_FORMAL_ROOT: ${{ vars.LEGAL_FORMAL_ROOT }}
      LEGAL_DEPRECATED_PATH: ${{ vars.LEGAL_DEPRECATED_PATH }}
      LEGAL_CURRENT_ENGINEERING_ROOT: ${{ vars.LEGAL_CURRENT_ENGINEERING_ROOT }}
      LEGAL_CANDIDATE_ROOT: ${{ vars.LEGAL_CANDIDATE_ROOT }}
      LEGAL_ENGINEERING_ROOT: ${{ vars.LEGAL_ENGINEERING_ROOT }}
    steps:
      - name: Enable Windows long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          clean: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve validated local batch
        id: batch
        run: |
          $candidateBatch = '${{ inputs.candidate_batch }}'
          $engineeringBatch = '${{ inputs.engineering_batch }}'
          foreach ($value in @($candidateBatch, $engineeringBatch)) {
            if ($value -notmatch '^[A-Za-z0-9._-]+$') {
              throw 'BATCH_NAME_INVALID'
            }
          }
          $candidate = Join-Path (Resolve-Path $env:LEGAL_CANDIDATE_ROOT).Path $candidateBatch
          $engineering = Join-Path (Resolve-Path $env:LEGAL_ENGINEERING_ROOT).Path $engineeringBatch
          if (-not (Test-Path -LiteralPath $candidate -PathType Container)) {
            throw 'CANDIDATE_BATCH_NOT_FOUND'
          }
          if (-not (Test-Path -LiteralPath $engineering -PathType Container)) {
            throw 'ENGINEERING_BATCH_NOT_FOUND'
          }
          "candidate=$candidate" >> $env:GITHUB_OUTPUT
          "engineering=$engineering" >> $env:GITHUB_OUTPUT

      - name: Publish verified dataset and GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $statePointer = 'workspace/runtime/current_engineering_root.txt'
          $currentEngineering = $env:LEGAL_CURRENT_ENGINEERING_ROOT
          if (Test-Path -LiteralPath $statePointer) {
            $currentEngineering = (Get-Content -LiteralPath $statePointer -Raw).Trim()
          }
          if ([string]::IsNullOrWhiteSpace($currentEngineering)) {
            throw 'CURRENT_ENGINEERING_ROOT_NOT_CONFIGURED'
          }
          New-Item -ItemType Directory -Force -Path 'workspace/runtime' | Out-Null
          $releaseDirectory = Join-Path (Resolve-Path workspace/runtime).Path `
            'release-${{ github.run_id }}-${{ github.run_attempt }}'
          $resultPath = Join-Path (Resolve-Path workspace/runtime).Path `
            'release-result-${{ github.run_id }}-${{ github.run_attempt }}.json'
          python tools/publish_dataset_release.py `
            --release-mode '${{ inputs.release_mode }}' `
            --milestone-name '${{ inputs.milestone_name }}' `
            --milestone-confirm '${{ inputs.milestone_confirm }}' `
            --result-path $resultPath `
            --candidate '${{ steps.batch.outputs.candidate }}' `
            --engineering-root '${{ steps.batch.outputs.engineering }}' `
            --release-directory $releaseDirectory `
            --target $env:LEGAL_FORMAL_ROOT `
            --current-engineering-root $currentEngineering `
            --source-root $env:LEGAL_SOURCE_ROOT `
            --deprecated-path $env:LEGAL_DEPRECATED_PATH `
            --state-pointer $statePointer `
            --repository '${{ github.repository }}' `
            --commit-sha '${{ github.sha }}' `
            --run-id '${{ github.run_id }}.${{ github.run_attempt }}'
          if ($LASTEXITCODE -ne 0) { throw "DATASET_RELEASE_FAILED:$LASTEXITCODE" }
          $result = Get-Content -LiteralPath $resultPath -Raw | ConvertFrom-Json
          "status=$($result.status)" >> $env:GITHUB_OUTPUT
          "snapshot_required=$($result.snapshot_required.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "release_directory=$($result.release_directory)" >> $env:GITHUB_OUTPUT

      - name: Upload changed dataset snapshot
        if: steps.release.outputs.snapshot_required == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dataset-snapshot-${{ github.run_id }}
          path: |
            ${{ steps.release.outputs.release_directory }}/legal_contents.csv.zip
            ${{ steps.release.outputs.release_directory }}/legal_documents.csv.zip
            ${{ steps.release.outputs.release_directory }}/case_holdings.csv
            ${{ steps.release.outputs.release_directory }}/case_legal_references.csv
            ${{ steps.release.outputs.release_directory }}/cases.csv
            ${{ steps.release.outputs.release_directory }}/practice_references.csv
            ${{ steps.release.outputs.release_directory }}/legal_relations.csv
            ${{ steps.release.outputs.release_directory }}/legal_sources.csv
            ${{ steps.release.outputs.release_directory }}/SHA256SUMS
            ${{ steps.release.outputs.release_directory }}/dataset-manifest.json
            ${{ steps.release.outputs.release_directory }}/release-SHA256SUMS
          if-no-files-found: error
          retention-days: 15
