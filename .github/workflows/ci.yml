name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: official-source-updater/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install updater dependencies
        run: python -m pip install -r official-source-updater/requirements.txt
      - name: Validate updater registry
        run: python official-source-updater/updater.py validate --database-root corpus
      - name: Run updater tests
        working-directory: official-source-updater
        run: python -m unittest discover -s tests -v
      - name: Run dataset contract tests
        run: |
          python tests/test_network_configuration.py
          python tests/test_build_accepted_coding_baseline.py
          python tests/test_pre_release_assets.py
          python tests/test_publish_validated_dataset.py
          python tests/test_validate_dataset.py
          python tests/test_prepare_dataset_release.py
          python tests/test_publish_dataset_release.py
          node --test tests/test_build_local_csv.mjs
          node --test tools/test/component_context.test.mjs tools/test/formal_text.test.mjs tools/test/legal_document_body.test.mjs tools/test/legal_structure.test.mjs
      - name: Run multi-source verifier tests
        run: |
          $env:PYTHONPATH = (Resolve-Path tools/verification_system).Path
          python -m unittest discover -s tests/verification_system -p "test_*.py" -v
      - name: Compile Python sources
        run: python -m compileall -q official-source-updater tools tests
